name: CLI release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches CLI version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "q2q") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    name: Build ${{ matrix.target }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --locked --release -p q2q --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="q2q-${version}-${{ matrix.target }}"
          mkdir -p dist/staging
          cp "target/${{ matrix.target }}/release/q2q" dist/staging/
          cp LICENSE README.md dist/staging/
          tar -czf "dist/${name}.tar.gz" -C dist/staging .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $name = "q2q-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist/staging -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/q2q.exe" dist/staging/
          Copy-Item LICENSE dist/staging/
          Copy-Item README.md dist/staging/
          Compress-Archive -Path dist/staging/* -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: q2q-${{ matrix.target }}
          path: dist/q2q-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [validate-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: cd dist && sha256sum q2q-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Q2Q $GITHUB_REF_NAME"
          fi
