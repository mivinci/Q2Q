name: CLI release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version, main ancestry, CI and approval configuration
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cli-release.py resolve

  approve:
    name: Approve CLI release and create tag
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Create immutable release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Q2Q CLI $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  publish:
    needs: [validate, approve]
    permissions:
      contents: write
    uses: ./.github/workflows/cli-release-build.yml
    with:
      sha: ${{ needs.validate.outputs.sha }}
      tag: ${{ needs.validate.outputs.tag }}
