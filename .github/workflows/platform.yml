name: Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base for automated version PRs; empty forces a full run'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Platform check, build, and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine application impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: python3 .github/scripts/app-impact.py platform
      - uses: actions/setup-node@v4
        if: steps.impact.outputs.run == 'true'
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
        if: steps.impact.outputs.run == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.impact.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.impact.outputs.run == 'true'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: steps.impact.outputs.run == 'true'
      - run: npm run platform:check
        if: steps.impact.outputs.run == 'true'
      - run: npm run platform:check:processing
        if: steps.impact.outputs.run == 'true'
      - run: npm run platform:check:storage
        if: steps.impact.outputs.run == 'true'
      - run: npm run platform:build
        if: steps.impact.outputs.run == 'true'
        env:
          Q2Q_PUBLIC_ORIGIN: https://platform.q2q.app
          VITE_BUILD_COMMIT: ${{ github.sha }}

      # Deploy only after successful checks on main. PR builds never receive Cloudflare credentials.
      - name: Verify Cloudflare deployment credentials
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 1
          fi

      - name: Deploy platform Worker
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
