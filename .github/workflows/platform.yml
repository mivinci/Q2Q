name: Platform

on:
  push:
    branches: [main]
    paths:
      - 'crates/q2q-core/**'
      - 'crates/q2q-wasm/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'apps/platform/**'
      - 'docs/public/logo-light.svg'
      - 'docs/public/logo-dark.svg'
      - 'docs/public/favicon.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/platform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/q2q-core/**'
      - 'crates/q2q-wasm/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'apps/platform/**'
      - 'docs/public/logo-light.svg'
      - 'docs/public/logo-dark.svg'
      - 'docs/public/favicon.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/platform.yml'

permissions:
  contents: read

jobs:
  check:
    name: Platform check and build
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run platform:check
      - run: npm run platform:check:processing
      - run: npm run platform:build
