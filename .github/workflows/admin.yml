name: Admin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base; empty forces a full run'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Admin check, test, build, and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine application impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: python3 .github/scripts/app-impact.py admin
      - uses: actions/setup-node@v4
        if: steps.impact.outputs.run == 'true'
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --workspace @q2q/admin --include-workspace-root=false
        if: steps.impact.outputs.run == 'true'
      - run: npm run check --workspace @q2q/admin
        if: steps.impact.outputs.run == 'true'
      - run: npm test --workspace @q2q/admin
        if: steps.impact.outputs.run == 'true'
      - run: npm run build --workspace @q2q/admin
        env:
          Q2Q_PUBLIC_ORIGIN: https://admin.q2q.app
        if: steps.impact.outputs.run == 'true'
      # PR builds never receive Cloudflare credentials.
      - name: Verify deployment credentials and Access configuration
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ADMIN_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ADMIN_ACCESS_AUD }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$ACCESS_TEAM_DOMAIN" || -z "$ACCESS_AUD" ]]; then
            echo "::error::Missing Cloudflare credentials or ADMIN_ACCESS_TEAM_DOMAIN / ADMIN_ACCESS_AUD repository variables."
            exit 1
          fi
          if [[ ! "$ACCESS_TEAM_DOMAIN" =~ ^[a-z0-9][a-z0-9-]*\.cloudflareaccess\.com$ ]]; then
            echo "::error::ADMIN_ACCESS_TEAM_DOMAIN must be a team.cloudflareaccess.com hostname without a scheme or path."
            exit 1
          fi
          if [[ -z "${ACCESS_AUD//[[:space:]]/}" ]]; then
            echo "::error::ADMIN_ACCESS_AUD must not be blank."
            exit 1
          fi

      - name: Verify platform admin migrations before deployment
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute PLATFORM_DB --remote --command "SELECT id, maxFileSizeBytes, storageBytes, revision FROM plan_catalog ORDER BY id; SELECT requestId FROM admin_operation LIMIT 0; SELECT revision FROM project_subscription LIMIT 0; SELECT disabledAt, accessRevision, authVersion FROM user LIMIT 0; SELECT authVersion FROM session LIMIT 0; SELECT requestId FROM registry_request LIMIT 0;"

      - name: Wait for Registry deployment on the same commit
        if: steps.impact.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/wait-registry.py

      - name: Deploy admin Worker
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ADMIN_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ADMIN_ACCESS_AUD }}
        run: npx wrangler deploy --config wrangler.jsonc --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD"
