name: WWW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base for automated version PRs; empty forces a full run'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: WWW check, build, browser tests, and deployment
    # Playwright 1.57 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine application impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: python3 .github/scripts/app-impact.py www
      - uses: actions/setup-node@v4
        if: steps.impact.outputs.run == 'true'
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: python3 .github/scripts/test-app-impact.py
        if: steps.impact.outputs.run == 'true'
      - run: npm ci
        if: steps.impact.outputs.run == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.impact.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.impact.outputs.run == 'true'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: steps.impact.outputs.run == 'true'
      - run: npm run wasm:build
        if: steps.impact.outputs.run == 'true'
      - name: Check shared Punch endpoint contract
        if: steps.impact.outputs.run == 'true'
        run: |
          npm run check --workspace @q2q/punch-discovery
          npm test --workspace @q2q/punch-discovery
      - run: npm run www:check
        if: steps.impact.outputs.run == 'true'
      - run: npm run www:build
        if: steps.impact.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium webkit
        if: steps.impact.outputs.run == 'true'
      - run: npm test --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:browser --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:http --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:bundle --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
        env:
          VITE_RESOLVE_FROM: apps/www/package.json
      - run: npm run wasm:check -- 1
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:network --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:rtc --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:p2p --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:partial --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run test:publish --workspace @q2q/client-web
        if: steps.impact.outputs.run == 'true'
      - run: npm run www:test
        if: steps.impact.outputs.run == 'true'
        env:
          WWW_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: always() && steps.impact.outputs.run == 'true'
        with:
          name: www-browser-reports
          path: |
            .tmp/www-playwright
            .tmp/client-web-playwright
          retention-days: 7

      # Deploy only after successful checks on main. PR builds never receive Cloudflare credentials.
      - name: Verify Cloudflare deployment credentials
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 1
          fi

      - name: Deploy www Worker
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        working-directory: apps/www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
