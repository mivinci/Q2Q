name: Rust

# 只覆盖 crates 下的 Rust 代码。改文档不会触发这里，改 Rust 也不会触发 Docs——
# 两边各管各的路径。

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.github/workflows/rust.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 没有缓存的话每次都要从头编译依赖，慢得没必要
      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: 安装匹配 Cargo.lock 的绑定工具
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: 无默认 feature 的构建器测试
        run: cargo test -p q2q-primitives --no-default-features --test seed_builder
      - name: Wasm Clippy
        run: cargo clippy -p q2q-wasm --target wasm32-unknown-unknown --release -- -D warnings
      - name: 生成绑定与运行验证
        run: npm run wasm:build && npm run wasm:check
