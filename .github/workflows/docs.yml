name: Docs

# 文档站点：VitePress 构建 + 自检。
# push main 和 PR 都会跑「构建 + 自检」，只有 push main 才部署到 Pages。
#
# 这个仓库的 Pages 是 build_type=workflow，必须走 upload-pages-artifact +
# deploy-pages，推 gh-pages 分支那种方式在这里不生效。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 按 ref 分组，省得 PR 的运行和 main 的运行互相排队
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装构建依赖
        run: |
          for attempt in 1 2 3; do
            if npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed (attempt $attempt/3); retrying in 10 seconds..."
              sleep 10
            fi
          done

          exit 1

      - name: 构建并自检
        # e2e 用 playwright 驱动 runner 自带的 Chrome，不额外下载浏览器
        run: |
          export CHROME_PATH=$(command -v google-chrome || echo /usr/bin/google-chrome)
          npm test

      # 以下三步只在 main 上跑——PR 只做检查，不发布
      - name: 配置 Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 上传产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: 部署到 Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
        id: deployment
