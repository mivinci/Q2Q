name: Docs

# 文档站点：VitePress 构建后用官方 Pages actions 部署。
# 这个仓库的 Pages 是 build_type=workflow，必须走 upload-pages-artifact +
# deploy-pages，推 gh-pages 分支那种方式在这里不生效。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'e2e/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装构建依赖
        run: npm install

      - name: 构建并自检
        # e2e 用 playwright 驱动 runner 自带的 Chrome，不额外下载浏览器
        run: |
          export CHROME_PATH=$(command -v google-chrome || echo /usr/bin/google-chrome)
          npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - uses: actions/deploy-pages@v4
        id: deployment
