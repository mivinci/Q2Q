name: Native service images release

on:
  push:
    branches: [main]
    paths:
      - 'crates/q2q-punch-server/Cargo.toml'
      - 'crates/q2q-track-server/Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/q2q-punch-server/Cargo.toml'
      - 'crates/q2q-track-server/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-service-release.yml'
      - '.github/scripts/native-service-release.py'
      - '.github/scripts/test-native-service-release.py'

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [punch, track]
    concurrency:
      group: native-release-${{ matrix.service }}-${{ github.event_name == 'push' && 'main' || github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_SERVICE: ${{ matrix.service }}
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release guards
        run: python3 .github/scripts/test-native-service-release.py
      - name: Detect and validate service version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/native-service-release.py resolve
      - name: Wait for Rust CI on this commit
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/native-service-release.py wait-rust
      - name: Check the image tag is unused
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 .github/scripts/native-service-release.py check-image
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build service image
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/q2q-${{ matrix.service }}-server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/q2q-${{ matrix.service }}-server:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Verify the built binary version
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/q2q-${RELEASE_SERVICE}-server:$RELEASE_TAG"
          test "$(docker run --rm "$image" --version)" = "q2q-${RELEASE_SERVICE}-server $RELEASE_VERSION"
      - name: Create immutable Git tag
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify "refs/tags/$RELEASE_SERVICE/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_SERVICE/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag -a "$RELEASE_SERVICE/$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_SERVICE $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_SERVICE/$RELEASE_TAG"
          fi
      - name: Publish service image
        if: github.event_name == 'push' && steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/q2q-${RELEASE_SERVICE}-server"
          docker push "$image:$RELEASE_TAG"
          docker tag "$image:$RELEASE_TAG" "$image:latest"
          docker push "$image:latest"
