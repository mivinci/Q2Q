name: Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base; empty forces a full run'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Registry check, test, build, and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine application impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: python3 .github/scripts/app-impact.py registry
      - uses: actions/setup-node@v4
        if: steps.impact.outputs.run == 'true'
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --workspace @q2q/registry --include-workspace-root=false
        if: steps.impact.outputs.run == 'true'
      - run: npm run check --workspace @q2q/registry
        if: steps.impact.outputs.run == 'true'
      - run: npm test --workspace @q2q/registry
        if: steps.impact.outputs.run == 'true'
      - run: npm run build --workspace @q2q/registry
        if: steps.impact.outputs.run == 'true'
      # PR builds never receive Cloudflare credentials.
      - name: Verify Cloudflare deployment credentials
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Deploy registry Worker
        if: >-
          steps.impact.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        working-directory: apps/registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
