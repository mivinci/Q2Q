name: Seed Processing Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/seed-processing/**'
      - 'packages/s3-storage/**'
      - 'packages/seed-processing-contract/**'
      - 'crates/q2q-primitives/**'
      - 'crates/q2q-wasm/**'
      - 'apps/platform/migrations/**'
      - 'apps/platform/scripts/check-processing.mjs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/seed-processing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/seed-processing/**'
      - 'packages/s3-storage/**'
      - 'packages/seed-processing-contract/**'
      - 'crates/q2q-primitives/**'
      - 'crates/q2q-wasm/**'
      - 'apps/platform/migrations/**'
      - 'apps/platform/scripts/check-processing.mjs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/seed-processing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Seed processing check, build, and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run seed-processing:build
      - run: npm run seed-processing:check
      - run: npm run platform:check:processing

      # PR builds never receive Cloudflare credentials.
      - name: Verify Cloudflare deployment credentials
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Deploy seed processing Worker
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        working-directory: apps/seed-processing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
