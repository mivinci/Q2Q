<dialog data-upload aria-label="上传文件"><div class="q-dialog-head"><div><h2>上传文件</h2><p class="q-description">为内容添加一个可靠的存储来源。</p></div><button type="button" class="q-icon-button cursor-interaction" data-close aria-label="关闭上传"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="q-drop"><i data-lucide="cloud-upload" aria-hidden="true"></i><strong>选择要分发的文件</strong><span class="q-caption">文件将直接上传至所选存储</span><input type="file" class="q-upload-input" aria-label="选择上传文件" data-upload-file></div><label class="q-field">目标存储<select data-upload-storage><option>Q2Q 平台存储</option><option>Studio · 自有 S3</option></select></label><div class="q-dialog-actions"><button type="button" class="q-button cursor-interaction" data-close>取消</button><button type="button" class="q-button q-primary cursor-interaction" data-action="confirm-upload">添加到内容库</button></div><div class="q-notice" data-upload-notice role="status" aria-live="polite"></div></dialog>
<script>
(()=>{const root=document.getElementById('q2q-platform-preview');const $=s=>root.querySelector(s);const $$=s=>Array.from(root.querySelectorAll(s));const saved=window.openai?.widgetState||{};const state={theme:saved.privateContent?.theme||'system',page:saved.privateContent?.page||'files',filter:'all',search:'',radius:16};const files=[{name:'Aurora 品牌素材.zip',type:'zip',size:'1.8 GB',peers:3,source:'R2',updated:'10 分钟前',date:'2026年10月18日',status:'可下载'},{name:'产品发布会.mp4',type:'video',size:'4.2 GB',peers:8,source:'S3',updated:'42 分钟前',date:'2026年10月18日',status:'可下载'},{name:'模型权重-v2.safetensors',type:'model',size:'8.6 GB',peers:5,source:'R2',updated:'今天 09:24',date:'2026年10月18日',status:'可下载'},{name:'客户端-macOS.dmg',type:'app',size:'148 MB',peers:2,source:'R2',updated:'昨天',date:'2026年10月17日',status:'可下载'},{name:'设计源文件.fig',type:'design',size:'286 MB',peers:0,source:'本机',updated:'昨天',date:'2026年10月17日',status:'等待来源'},{name:'使用指南.pdf',type:'document',size:'3.4 MB',peers:1,source:'R2',updated:'10月16日',date:'2026年10月16日',status:'可下载'}];const icons={zip:'file-archive',video:'file-video',model:'box',app:'app-window',design:'pen-tool',document:'file-text'};let selected=files[0];const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>window.openai?.setWidgetState?.({modelContent:{design:'Apple 风格平台控制台',theme:state.theme,page:state.page},privateContent:{theme:state.theme,page:state.page}})?.catch(()=>{});const refreshIcons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})};
function theme(){root.style.colorScheme=state.theme==='system'?'light dark':state.theme;$$('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme)));}function rows(){const list=files.filter(f=>(state.filter==='all'||(state.filter==='active'?f.peers>0:f.peers===0))&&f.name.toLowerCase().includes(state.search.toLowerCase()));$('[data-rows]').innerHTML=list.map(f=>`<tr><td><button type="button" class="q-file cursor-interaction" data-file="${escape(f.name)}" data-tooltip="${escape(f.name)}"><span class="q-file-icon" data-kind="${f.type}"><i data-lucide="${icons[f.type]}" aria-hidden="true"></i></span><span class="q-grow"><span class="q-file-name">${escape(f.name)}</span><span class="q-file-meta ${f.peers===0?'q-offline':''}"><span class="q-online"></span>${f.status}</span></span></button></td><td><span class="q-source"><i data-lucide="${f.peers?'radio':'laptop'}" aria-hidden="true"></i>${f.status==='待上传'?'待上传':f.peers?f.peers+' Peer · '+f.source:'本机离线'}</span></td><td class="q-size q-muted">${f.size}</td><td class="q-updated q-muted">${f.updated}</td><td class="q-more"><button type="button" class="q-icon-button cursor-interaction" data-file="${escape(f.name)}" aria-label="${escape(f.name)}的详情"><i data-lucide="ellipsis" aria-hidden="true"></i></button></td></tr>`).join('')||'<tr><td colspan="5" class="q-empty">没有符合条件的内容</td></tr>';$('[data-result-count]').textContent=list.length+' 个内容';$('.q-nav [data-page=files] .q-nav-count').textContent=files.length;$$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));refreshIcons();}
const pages={files:['内容库','管理文件、来源与分发。','上传文件'],storage:['存储空间','连接你的存储，或使用平台存储。','连接存储'],peers:['做种节点','查看为内容提供来源的在线设备。','添加设备'],usage:['用量与套餐','分别了解存储、平台出口与中继用量。','管理套餐']};function resource(icon,title,sub,value){return `<div class="q-resource"><i data-lucide="${icon}" aria-hidden="true"></i><div class="q-grow"><h3>${title}</h3><p>${sub}</p></div><div class="q-resource-value">${value}</div></div>`}function page(){const p=pages[state.page]||pages.files;$('[data-title]').textContent=p[0];$('[data-breadcrumb]').textContent=p[0];$('[data-description]').textContent=p[1];$('[data-primary-label]').textContent=p[2];$$('.q-nav [data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('[data-files]').hidden=state.page!=='files';$('[data-other]').hidden=state.page==='files';if(state.page==='storage')$('[data-other]').innerHTML=resource('cloud','Q2Q 平台存储','平台托管 · 示例配额 1 TB','128 GB 已使用')+resource('hard-drive','Studio · 自有 S3','用户自带存储 · 访问权限受限','已连接');if(state.page==='peers')$('[data-other]').innerHTML=resource('laptop','MacBook Pro','本机 · 正在提供 4 个内容','在线')+resource('monitor','Studio Mac mini','设备节点 · 正在提供 6 个内容','在线')+resource('server','分发节点 · Singapore','原生做种节点 · 正在提供 6 个内容','在线');if(state.page==='usage')$('[data-other]').innerHTML=resource('hard-drive','存储容量','示例配额 · 平台存储','128 GB / 1 TB')+resource('arrow-up-right','平台出口','示例用量 · 本月','214 GB')+resource('route','TURN 中继','示例用量 · 本月','72 GB');$('[data-notice]').textContent='';refreshIcons();}
function detail(name){selected=files.find(f=>f.name===name)||files[0];$('[data-detail-title]').textContent=selected.name;$('[data-detail-rows]').innerHTML=[['大小',selected.size],['可用状态',selected.status],['在线 Peer',selected.peers+' 个'],['存储来源',selected.source==='本机'?'仅本机':selected.source==='R2'?'Q2Q 平台存储':'Studio · 自有 S3'],['版本',selected.date],['完整性校验','逐块验证']].map(([a,b])=>`<div class="q-detail-row"><span>${a}</span><span>${escape(b)}</span></div>`).join('');$('[data-detail-notice]').textContent='';$('[data-detail]').showModal();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme){state.theme=b.dataset.theme;theme();persist();}if(b.dataset.filter){state.filter=b.dataset.filter;rows();}if(b.dataset.page){state.page=b.dataset.page;page();persist();}if(b.dataset.file)detail(b.dataset.file);if(b.hasAttribute('data-close'))b.closest('dialog').close();const action=b.dataset.action;if(action==='upload'){if(state.page==='files'){$('[data-upload-notice]').textContent='';$('[data-upload]').showModal();}else $('[data-notice]').textContent=state.page==='storage'?'连接存储将支持自有 S3 Bucket。':state.page==='peers'?'通过官方客户端连接并授权设备。':'套餐与具体配额将在产品设计中确定。';}if(action==='notifications')$('[data-notice]').textContent='当前没有新的通知。';if(action==='seed')$('[data-detail-notice]').textContent='此处将导出 '+selected.name+' 的种子文件。';if(action==='share')$('[data-detail-notice]').textContent=selected.peers?'分享设置将包含访问权限与有效期。':'当前没有在线来源，请先连接本机或添加存储副本。';if(action==='confirm-upload'){const file=$('[data-upload-file]').files[0];if(!file){$('[data-upload-notice]').textContent='请先选择文件。';return;}files.unshift({name:file.name,type:'document',size:(file.size/1024/1024).toFixed(1)+' MB',peers:0,source:$('[data-upload-storage]').value.includes('S3')?'S3':'R2',updated:'刚刚',date:'待上传',status:'待上传'});$('[data-upload]').close();state.page='files';state.filter='all';state.search='';$('[data-search]').value='';page();rows();$('[data-notice]').textContent='已加入预览列表；此设计预览不会上传文件。';}});$('[data-search]').addEventListener('input',e=>{state.search=e.target.value;rows()});theme();page();rows();window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s){if(['light','dark','system'].includes(s.theme))state.theme=s.theme;if(pages[s.page])state.page=s.page;theme();page();}});if(globalThis.Tweak){const tweaks=new Tweak({container:root,onChange:()=>{$('.q-shell').style.borderRadius=state.radius+'px';}});tweaks.addSlider(state,'radius',{label:'窗口圆角',min:8,max:24,step:2,unit:'px'});}})();
</script>
</div>
