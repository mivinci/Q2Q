# Single-node deployment: Track, one Punch Server, and coturn for the cases
# where a direct connection cannot be made.
#
# This file is a static-list example. For Registry deployment with explicit
# identity preparation and signed node credentials, follow
# docs/en/guide/deploy-single-node.md.

services:
  track:
    image: ghcr.io/mivinci/q2q-track-server:v0.1.0
    restart: unless-stopped
    volumes:
      - ./track.toml:/etc/q2q/track.toml:ro
    ports:
      - "8080:8080/tcp"
    # the Punch list is re-read from track.toml every few seconds, so editing
    # it does not need a restart
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/files/sha256:00/peers"]
      interval: 30s
      timeout: 5s
      retries: 3

  punch:
    image: ghcr.io/mivinci/q2q-punch-server:v0.1.0
    restart: unless-stopped
    volumes:
      - ./punch.toml:/etc/q2q/punch.toml:ro
      # the identity outlives the container: clients verify this server by its
      # public key, so it must not change on restart
      - ./punch-identity:/etc/q2q/identity
    ports:
      # QUIC and WSS share port 4433 over separate UDP/TCP transports.
      - "4433:4433/udp"
      - "4433:4433/tcp"

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      - -n
      - --listening-port=3478
      - --realm=q2q.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --external-ip=${PUBLIC_IP}
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
