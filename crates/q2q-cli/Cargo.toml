[package]
name = "q2q-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line client for Q2Q file delivery"
license = "MIT"
autotests = false

[[bin]]
name = "q2q"
path = "src/main.rs"

[dependencies]
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive", "env"] }
q2q = { version = "0.1.0", path = "../q2q" }
q2q-core = { version = "0.1.0", path = "../q2q-core" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }

[[test]]
name = "cli"
path = "tests/cli.rs"
