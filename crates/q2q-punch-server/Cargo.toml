[package]
name = "q2q-punch-server"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
q2q-core = { version = "0.1.0", path = "../q2q-core" }
q2q-punch = { version = "0.1.0", path = "../q2q-punch" }
q2q-ratelimit = { version = "0.1.0", path = "../q2q-ratelimit" }
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
