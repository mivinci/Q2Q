[package]
name = "q2q-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin WebAssembly bindings for Q2Q content preparation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
q2q-primitives = { path = "../q2q-primitives", default-features = false }
q2q-punch = { path = "../q2q-punch", default-features = false }
q2q-track = { path = "../q2q-track", default-features = false }
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
wasm-bindgen = "0.2"
serde_json = "1.0"
