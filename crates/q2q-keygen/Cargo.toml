[package]
name = "q2q-keygen"
version = "0.1.0"
edition = "2024"
description = "Ed25519 key pair generation and JWT signing"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
