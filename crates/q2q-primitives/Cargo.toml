[package]
name = "q2q-primitives"
version = "0.1.0"
edition = "2021"
description = "Q2Q 网络无关的基础类型与协议：身份、种子、Merkle 证明与本地存储"
license = "MIT"

[features]
default = ["storage", "random"]
storage = []
random = ["dep:getrandom"]

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = { version = "0.4.3", optional = true }
hmac = "0.13.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
