[package]
name = "q2q-punch"
version = "0.1.0"
edition = "2024"

[features]
default = ["server"]
server = ["dep:getrandom", "dep:parking_lot", "q2q-primitives/default"]

[dependencies]
base64 = "0.23.1"
getrandom = { version = "0.4.3", optional = true }
parking_lot = { version = "0.12.5", optional = true }
q2q-primitives = { version = "0.1.0", path = "../q2q-primitives", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
