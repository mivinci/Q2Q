[package]
name = "q2q-core"
version = "0.1.0"
edition = "2024"
description = "Q2Q client SDK"
license = "MIT"
# Test helpers and private-unit modules live beside the integration target.
autotests = false

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
q2q-http = { version = "0.1.0", path = "../q2q-http" }
q2q-primitives = { version = "0.1.0", path = "../q2q-primitives" }
q2q-punch = { version = "0.1.0", path = "../q2q-punch" }
q2q-track = { version = "0.1.0", path = "../q2q-track" }
quinn = "0.11.12"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
webrtc = "0.21.1"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
tokio-rustls = "0.26.6"
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util"] }

[[test]]
name = "sdk"
path = "tests/sdk.rs"

[[test]]
name = "local_upload"
path = "tests/local_upload.rs"

[[test]]
name = "local_sharing"
path = "tests/local_sharing.rs"

[[test]]
name = "track_workers"
path = "tests/track_workers.rs"
