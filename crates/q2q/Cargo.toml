[package]
name = "q2q"
version = "0.1.0"
edition = "2024"
description = "Q2Q client SDK"
license = "MIT"
# Test helpers and private-unit modules live beside the integration target.
autotests = false

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
q2q-core = { version = "0.1.0", path = "../q2q-core" }
q2q-punch = { version = "0.1.0", path = "../q2q-punch" }
q2q-track = { version = "0.1.0", path = "../q2q-track" }
quinn = "0.11.12"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = "2.5.8"
webrtc = "0.21.1"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[[test]]
name = "sdk"
path = "tests/sdk.rs"
