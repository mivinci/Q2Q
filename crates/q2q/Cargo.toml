[package]
name = "q2q"
version = "0.2.0"
edition = "2024"
description = "Command-line client for Q2Q file delivery"
license = "MIT"
autotests = false

[[bin]]
name = "q2q"
path = "src/main.rs"

[dependencies]
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive", "env"] }
q2q-core = { version = "0.1.0", path = "../q2q-core" }
q2q-primitives = { version = "0.1.0", path = "../q2q-primitives" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[[test]]
name = "cli"
path = "tests/cli.rs"
